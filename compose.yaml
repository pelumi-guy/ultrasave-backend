services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ultrasave
      POSTGRES_DB: ultrasave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U ultrasave]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment: &settings
      ULTRASAVE_DATABASE_URL: ${ULTRASAVE_DATABASE_URL:?Set the PostgreSQL connection URL in .env}
      ULTRASAVE_PUBLIC_URL: ${ULTRASAVE_PUBLIC_URL:?Set a phone-reachable public URL in .env}
      ULTRASAVE_FIXTURES: ${ULTRASAVE_FIXTURES:-true}
      ULTRASAVE_LIVE_SOURCES: ${ULTRASAVE_LIVE_SOURCES-twitter,threads,tiktok,youtube}
      ULTRASAVE_MAX_MEDIA_BYTES: ${ULTRASAVE_MAX_MEDIA_BYTES:-157286400}
      ULTRASAVE_MAX_DURATION_SECONDS: ${ULTRASAVE_MAX_DURATION_SECONDS:-900}
      ULTRASAVE_PREPARATION_TIMEOUT: ${ULTRASAVE_PREPARATION_TIMEOUT:-240}
    # Coolify's proxy reaches the container directly through its Docker network.
    expose: ["8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    volumes: [artifacts:/app/.data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      db: { condition: service_healthy }
      init: { condition: service_completed_successfully }
  init:
    build: .
    command: [python, -m, app.manage, init]
    environment: *settings
    volumes: [artifacts:/app/.data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }
  worker:
    build: .
    command: [python, -m, app.worker]
    environment: *settings
    volumes: [artifacts:/app/.data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      db: { condition: service_healthy }
      api: { condition: service_healthy }
volumes:
  database:
  artifacts:
